name: Build Plugin Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare plugin zip
        run: |
          rm -rf dist
          mkdir -p dist
          zip -r dist/unusual-places-explorer.zip unusual-places-explorer -x '*.DS_Store'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: unusual-places-explorer
          path: dist/unusual-places-explorer.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/unusual-places-explorer.zip
          generate_release_notes: true
